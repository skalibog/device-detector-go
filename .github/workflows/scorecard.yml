name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 1" # weekly — supply-chain posture drifts without commits
  push:
    branches: [main, master] # whichever is the default branch
  workflow_dispatch:

# Restrict token to the minimum; the analysis job opts back in explicitly.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read # job-level perms replace (not merge) read-all above; keep read for checkout
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to the public Scorecard API (badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true # feeds the README badge via api.securityscorecards.dev
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f # v3
        with:
          sarif_file: results.sarif
