name: Fuzz (on demand)

on:
  # Maintenance mode: the nightly cron is retired — with no new code landing,
  # continuous fuzzing only produces noise. The 60 s PR smoke in ci.yml still
  # guards database syncs; run this manually for a deep session.
  workflow_dispatch:
    inputs:
      fuzztime:
        description: How long to fuzz (Go duration)
        required: false
        default: "30m"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # open an issue on a fuzz crasher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.24"
      - name: Restore fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-parse-${{ github.run_id }}
          restore-keys: fuzz-parse-
      - name: Fuzz Parse
        run: go test -run='^$' -fuzz='FuzzParse$' -fuzztime=${{ inputs.fuzztime || '30m' }} .
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crashers
          path: testdata/fuzz/
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly fuzz found a crasher (run ${context.runId})`,
              body: `FuzzParse failed on the nightly run. Crasher inputs are attached as an artifact; add them under testdata/fuzz/ to reproduce.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'fuzz'],
            })
