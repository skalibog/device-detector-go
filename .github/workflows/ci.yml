name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # least privilege; the fixtures job opts into id-token: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.24"
      - name: gofmt
        run: test -z "$(gofmt -l . | grep -v testdata)"
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11.3
      - name: Examples (sievecache backend)
        # Separate module (own go.mod) so the example's third-party cache dep
        # never enters the root module's dependency graph.
        working-directory: examples/sievecache
        run: go test -count=1 ./...

  test:
    name: Tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "1.23", "1.24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
      - name: Unit tests (race)
        # The fixture corpus is excluded here: it has its own non-race job,
        # and under the race detector it exceeds hosted-runner budgets.
        run: go test -race -short -count=1 -skip TestFixtures -timeout 20m ./...

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.24"
      - name: Fuzz Parse (60s)
        run: go test -run='^$' -fuzz='FuzzParse$' -fuzztime=60s .

  apidiff:
    name: API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gorelease compares against the latest tag
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "stable"
      - name: gorelease
        # Hard gate since v1.0: additive ("Compatible") changes are fine, but an
        # incompatible change against the latest release must not merge without a
        # major bump (which for Go means a new /vN module path). gorelease itself
        # exits 0 on breaks and merely *suggests* a bump, so we grep its report.
        run: |
          go install golang.org/x/exp/cmd/gorelease@latest
          out=$(gorelease 2>&1) || true
          echo "$out"
          if echo "$out" | grep -qi 'incompatible changes'; then
            echo "::error::Incompatible API changes vs the latest release — needs a major (/vN) bump"
            exit 1
          fi
          # Fail closed: if gorelease didn't produce a comparison at all (network,
          # module resolution, internal error) the grep above would pass silently.
          if ! echo "$out" | grep -qiE 'suggested version|# summary'; then
            echo "::error::gorelease produced no compatibility report — gate inconclusive"
            exit 1
          fi

  fixtures:
    name: Upstream fixture corpus
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # tokenless Codecov upload via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.24"
      - name: Full corpus (37,640 entries, zero-mismatch gate) + coverage
        # Hosted runners are far slower than dev machines; go test's default
        # 10m timeout is not enough for the 37k-entry corpus.
        run: |
          go test -count=1 -coverpkg=./... -coverprofile=coverage.out -timeout 60m ./...
          go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.out
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: coverage.out
          fail_ci_if_error: false
